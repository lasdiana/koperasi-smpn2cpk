<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koperasi SMPN 2 Cipongkor</title>
  <!-- Google Fonts & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center p-0 md:p-4">

  <!-- Mobile Container -->
  <div class="w-full max-w-[450px] bg-white min-h-screen md:min-h-[840px] md:rounded-3xl shadow-xl flex flex-col justify-between overflow-hidden relative">
    
    <!-- Header -->
    <div class="bg-emerald-700 text-white p-6 rounded-b-3xl shadow-md">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h1 class="text-xs uppercase tracking-wider text-emerald-200 font-medium">Sistem Koperasi</h1>
          <h2 class="text-lg font-bold">SMPN 2 Cipongkor</h2>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold border border-emerald-400">
          K
        </div>
      </div>
      
      <!-- Total Saldo Card -->
      <div class="bg-emerald-800/60 p-4 rounded-2xl border border-emerald-500/30 backdrop-blur-sm">
        <p class="text-xs text-emerald-200">Total Kas Koperasi</p>
        <p id="totalSaldo" class="text-2xl font-bold mt-1">Rp 0</p>
      </div>
    </div>

    <!-- Main Content -->
    <div class="p-5 flex-1 space-y-6 overflow-y-auto">
      
      <!-- Quick Action Buttons -->
      <div class="grid grid-cols-3 gap-3">
        <button onclick="openModal('setor')" class="flex flex-col items-center justify-center p-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-2xl transition border border-emerald-200">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          <span class="text-xs font-semibold">Setor</span>
        </button>
        <button onclick="openModal('pinjam')" class="flex flex-col items-center justify-center p-3 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-2xl transition border border-amber-200">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
          <span class="text-xs font-semibold">Pinjam</span>
        </button>
        <button onclick="openModal('bayar')" class="flex flex-col items-center justify-center p-3 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-2xl transition border border-blue-200">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span class="text-xs font-semibold">Angsuran</span>
        </button>
      </div>

      <!-- Recent Transactions List -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-slate-700">Riwayat Transaksi</h3>
          <span class="text-xs text-slate-400">Terbaru</span>
        </div>
        <div id="transactionList" class="space-y-3">
          <p class="text-xs text-center text-slate-400 py-4">Memuat data dari database...</p>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="p-4 text-center border-t border-slate-100 bg-slate-50">
      <p class="text-[10px] text-slate-400">© Koperasi SMPN 2 Cipongkor • Firebase Realtime DB</p>
    </div>

    <!-- Modal Form -->
    <div id="modalForm" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-end md:items-center justify-center z-50 p-0 md:p-4">
      <div class="bg-white w-full max-w-[450px] rounded-t-3xl md:rounded-3xl p-6 space-y-4 animate-slide-up">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 id="modalTitle" class="font-bold text-slate-800">Tambah Transaksi</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
        </div>
        <form id="txForm" onsubmit="saveTransaction(event)">
          <input type="hidden" id="txType">
          <div class="space-y-3">
            <div>
              <label class="text-xs font-medium text-slate-600 block mb-1">Nama Anggota</label>
              <input type="text" id="txNama" required placeholder="Contoh: Pak Ahmad" class="w-full p-2.5 text-sm border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="text-xs font-medium text-slate-600 block mb-1">Jumlah (Rp)</label>
              <input type="number" id="txJumlah" required placeholder="0" class="w-full p-2.5 text-sm border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="text-xs font-medium text-slate-600 block mb-1">Keterangan</label>
              <input type="text" id="txKet" placeholder="Catatan opsional" class="w-full p-2.5 text-sm border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>
          <div class="flex gap-2 mt-5">
            <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 text-sm font-medium text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200">Batal</button>
            <button type="submit" id="btnSubmit" class="w-1/2 py-2.5 text-sm font-medium text-white bg-emerald-600 rounded-xl hover:bg-emerald-700">Simpan</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <!-- Firebase SDK Modular -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ============================================================
    // GANTI DENGAN KODE KONFIGURASI FIREBASE ANDA
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "koperasi-smpn2.firebaseapp.com",
      databaseURL: "https://koperasi-smpn2-default-rtdb.firebaseio.com",
      projectId: "koperasi-smpn2",
      storageBucket: "koperasi-smpn2.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abc123def456"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const txRef = ref(db, 'transaksi');

    // Load Data Transaksi secara Realtime
    onValue(txRef, (snapshot) => {
      const data = snapshot.val();
      const listContainer = document.getElementById('transactionList');
      let totalSaldo = 0;
      listContainer.innerHTML = '';

      if (!data) {
        listContainer.innerHTML = '<p class="text-xs text-center text-slate-400 py-4">Belum ada transaksi.</p>';
        document.getElementById('totalSaldo').innerText = 'Rp 0';
        return;
      }

      const items = Object.values(data).reverse(); // urutkan dari terbaru
      items.forEach(item => {
        const amount = parseInt(item.jumlah);
        if (item.tipe === 'setor' || item.tipe === 'bayar') {
          totalSaldo += amount;
        } else if (item.tipe === 'pinjam') {
          totalSaldo -= amount;
        }

        const isPlus = item.tipe === 'setor' || item.tipe === 'bayar';
        const badgeColor = item.tipe === 'setor' ? 'text-emerald-600 bg-emerald-50' : (item.tipe === 'pinjam' ? 'text-amber-600 bg-amber-50' : 'text-blue-600 bg-blue-50');

        const card = `
          <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-100">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-semibold text-sm text-slate-800">${item.nama}</span>
                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${badgeColor}">${item.tipe}</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">${item.keterangan || '-'} • ${item.tanggal}</p>
            </div>
            <span class="font-bold text-sm ${isPlus ? 'text-emerald-600' : 'text-amber-600'}">
              ${isPlus ? '+' : '-'} Rp ${amount.toLocaleString('id-ID')}
            </span>
          </div>
        `;
        listContainer.innerHTML += card;
      });

      document.getElementById('totalSaldo').innerText = 'Rp ' + totalSaldo.toLocaleString('id-ID');
    });

    // Fungsi Simpan ke Firebase
    window.saveTransaction = async (e) => {
      e.preventDefault();
      const tipe = document.getElementById('txType').value;
      const nama = document.getElementById('txNama').value;
      const jumlah = document.getElementById('txJumlah').value;
      const keterangan = document.getElementById('txKet').value;

      const newTx = {
        tipe,
        nama,
        jumlah,
        keterangan,
        tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
        timestamp: Date.now()
      };

      try {
        await push(txRef, newTx);
        closeModal();
      } catch (err) {
        alert('Gagal menyimpan data: ' + err.message);
      }
    };
  </script>

  <script>
    // Helper Fungsi Modal Tampilan
    function openModal(type) {
      document.getElementById('txType').value = type;
      const titles = { setor: 'Tambah Simpanan/Setoran', pinjam: 'Pengajuan Pinjaman', bayar: 'Pembayaran Angsuran' };
      document.getElementById('modalTitle').innerText = titles[type];
      document.getElementById('modalForm').classList.remove('hidden');
      document.getElementById('modalForm').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modalForm').classList.add('hidden');
      document.getElementById('modalForm').classList.remove('flex');
      document.getElementById('txForm').reset();
    }
  </script>
</body>
</html>
